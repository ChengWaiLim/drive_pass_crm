service: drive-pass-crm
frameworkVersion: '3'
provider:
  name: aws
  stage: dev
  ecr:
    images:
      drive-pass-crm:
        path: ./
        platform: linux/amd64
  region: ap-east-1
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "arn:aws:logs:*:*:*"
functions:
  drive-pass-crm:
    image:
      name: drive-pass-crm
      command:
        - handler.nuxt
      entryPoint:
        - '/lambda-entrypoint.sh'
    events:
      - http: ANY /
      - http: ANY /{proxy+}
plugins:
  - serverless-apigw-binary
  - serverless-domain-manager

custom:
  customDomain:
    domainName: houseofjoyhk.com
    basePath: 'drive-pass-crm'
    stage: prd
    createRoute53Record: true
  apigwBinary:
    types:
      - "*/*"